# =============================================================================
# FraudGNN — Configuración central
# Capstone MIA UAI — Freddy Torrealba (Grupo 18)
# Todos los hiperparámetros del sistema viven acá. Los scripts leen este
# archivo, así que cualquier ajuste (mezcla 40/60, LRs, umbrales del gatillo)
# se hace en un solo lugar.
# =============================================================================

compute:
  # Núcleos de CPU para TODO lo que corre en CPU: XGBoost, el OpenMP de
  # pyg-lib (neighbor sampling) y las BLAS de numpy/torch.
  #   -1 = todos los núcleos visibles.
  # OJO EN CONTENEDORES (RunPod, Docker, K8s): `nproc` reporta los núcleos del
  # HOST, no la cuota asignada. Compruébalo con:
  #     cat /sys/fs/cgroup/cpu.max      -> "765000 100000" = 7 CPUs reales
  # Con -1 se lanzarían 96 hilos para 7 núcleos: el kernel quema la cuota en
  # milisegundos y CONGELA el proceso el resto de cada ventana de 100 ms
  # (cgroup throttling). Poner aquí el número real lo evita.
  # Pod RTX 4000 Ada: 16 vCPU / 53 GB / 20 GB VRAM. 14 deja 2 vCPU al
  # SO y al proceso que alimenta la GPU. Manda en las etapas de CPU:
  # el kNN de SMOTE (594.273 x 95) y las partes de XGBoost que no van
  # en GPU. Durante `gnn` no compite con num_workers: el DataLoader
  # fija set_num_threads(1) dentro de cada worker (verificado).
  n_jobs: 14

paths:
  raw_dir: "data/raw"              # train_transaction.csv + train_identity.csv (IEEE-CIS)
  processed_dir: "data/processed"  # parquet procesados + splits temporales
  graph_dir: "data/graph"          # grafo PyG serializado (.pt)
  models_dir: "models"             # checkpoints de modelos
  artifacts_dir: "artifacts"       # buffer, control set, logs de ciclos CL
  reports_dir: "reports"           # métricas, comparaciones, gráficos
  history_dir: "historial"         # corridas archivadas (ver --archive)

kaggle:
  # Descarga del dataset. OJO: este archivo SE VERSIONA — el token NUNCA va acá.
  # `token_env` y `token_file` dicen DÓNDE buscar la credencial, no cuál es.
  # El script src/data/download_ieee_cis.py la busca en este orden:
  #   1. KAGGLE_USERNAME + KAGGLE_KEY   (recomendado: NO expira)
  #   2. variable de entorno token_env  (token de `kaggle auth login`, expira en horas)
  #   3. archivo .env en la raíz        (no versionado, ver .env.example)
  #   4. token_file o ~/.kaggle/kaggle.json ya instalados
  # Si encuentra el token por entorno o .env y no está instalado, lo escribe en
  # token_file con permisos 600 automáticamente.
  competition: "ieee-fraud-detection"
  token_env: "KAGGLE_API_TOKEN"        # el nombre que lee el SDK de Kaggle
  token_file: "~/.kaggle/access_token"
  # Solo estos dos archivos: el test de Kaggle no trae etiquetas, así que los
  # 6 "meses" del split temporal se cortan dentro de train_transaction.csv.
  files: ["train_transaction.csv", "train_identity.csv"]
  files_extra: ["test_transaction.csv", "test_identity.csv", "sample_submission.csv"]

data:
  # División temporal estricta (walk-forward, sin data leakage)
  # TransactionDT es segundos desde un t0 de referencia -> mes = DT // (86400*30)
  seconds_per_month: 2592000       # 86400 * 30
  train_months: [1, 2, 3, 4]       # entrenamiento original (~470K txn)
  val_month: 5                     # validación
  test_month: 6                    # test -> se divide en semanas ("futuro que llega")
  test_weeks: 4                    # el mes 6 se trata como 4 semanas de operación

graph:
  # GRAFO HETEROGÉNEO. Antes las transacciones se conectaban ENTRE SÍ cuando
  # compartían entidad (10,99 M aristas). Ahora hay nodos de ENTIDAD y las
  # aristas son bipartitas transacción <-> entidad (~2,5 M).
  #
  # Por qué cambia algo: el nodo de entidad tiene su PROPIO vector aprendido.
  # Antes el vecindario se resumía con una media fija; ahora "esta tarjeta"
  # es una representación que la red entrena y comparte entre sus
  # transacciones. Los nodos de entidad NO llevan features propias — su
  # contenido sale de agregar sus transacciones, lo que los hace inductivos:
  # una entidad que aparece por primera vez en el mes 6 funciona igual.
  entidades:
    # `cols`  columnas que forman la clave. Si CUALQUIERA es nula -> no hay
    #         nodo ni arista. Nunca se rellena con el texto "nan": hacerlo
    #         convertía el patrón de ausencia en parte de la identidad y
    #         partía a un mismo cliente en grupos distintos.
    # `usa_d1` añade (día - D1) a la clave. D1 es "días desde el primer uso
    #         de la tarjeta", así que día-D1 es CONSTANTE por cliente: es lo
    #         que distingue clientes que colisionan en el mismo card1.
    uid:    {cols: ["card1", "addr1"], usa_d1: true}      # el cliente real
    card:   {cols: ["card1", "card2", "card3", "card5"]}  # la tarjeta
    email:  {cols: ["P_emaildomain", "card1"]}            # card1 evita el hub de gmail
    device: {cols: ["DeviceInfo", "id_30", "id_31", "id_33"]}   # cobertura ~24%
    net:    {cols: ["id_13", "id_17", "id_19", "id_20"]}        # cobertura ~24%
  # Entidades con más transacciones que esto se PODAN. Su vector sería la
  # media del dataset entero y se repartiría a todos sus vecinos, borrando
  # diferencias en vez de crearlas. Distinto de un tope por nodo: limita el
  # tamaño de la ENTIDAD.
  max_entity_degree: 500
  vecinos_por_entidad: 10          # cuántas transacciones trae cada entidad
  # Features derivadas, para recuperar lo que daban las columnas C (conteos) y
  # D (tiempos) que la ablación quita. Quién las calcula NO es lo mismo:
  #
  #   __hora_dia          preprocess   hora del día en [0,1]. TransactionDT se
  #                                    excluye por ser identificador, así que sin
  #                                    esto nadie ve la hora. CÍCLICA: las 3 de
  #                                    la mañana son 0.125 en enero y en junio,
  #                                    así que se solapa al 99.9% entre splits.
  #
  #   __delta_anterior    preprocess   log1p(segundos desde la compra ANTERIOR de
  #                                    la misma card1); -1 si no hay anterior.
  #                                    Es lo que daba D1. Causal (diff hacia
  #                                    atrás) y comparable entre meses: "hace 2
  #                                    horas" vale igual en enero que en junio.
  #                                    OJO: al fabricarla se devuelve parte de lo
  #                                    que quita la ablación — decláralo al
  #                                    comparar corridas.
  #
  #   __grado_<entidad>   build_graph  cuántas transacciones tiene su entidad,
  #                                    antes de que el muestreo cape a 10. Es
  #                                    estructura del grafo, por eso va aquí y
  #                                    no en preprocess.
  #
  # DESCARTADA — __pos_temporal (posición en los 6 meses): train ocupa
  # [0, 0.667] y validación [0.667, 0.834], 0% de solapamiento. Los árboles no
  # extrapolan, así que fuera de la ventana es una constante; dentro da un valor
  # único por fila y permite memorizar. Medido: los meses in-sample pasaron de
  # 0.53 a 0.86 de PR-AUC y el mes 5 no se movió. No la vuelvas a meter.
  #
  # Este flag solo controla los __grado_*; las dos de preprocess van siempre.
  features_derivadas: true

gnn:
  # SOLO informativo: el ancho real lo lee cada entrenamiento del propio
  # grafo (train_gnn.py y compare_gnns.py lo sobrescriben). Depende de la
  # ablación y de las features derivadas, así que no intentes cuadrarlo.
  in_dim: 70                       # 63 tabulares + hora/posición + grados
  # --- PROFUNDIDAD: cada capa es un SALTO en el grafo -------------------------
  # Descomenta UNA. El número de capas es len(hidden_dims) y los `fanouts` se
  # recortan solos a esa longitud (src/gnn/sampling.py: fanouts()).
  #
  # Homofilia medida sobre este dataset (separación fraude vs legítima):
  #     1 salto  ->  3.9x   <- toda la señal está aquí
  #     2 saltos ->  0.7x      la señal se pierde
  #     3 saltos ->  0.3x      se INVIERTE (over-smoothing: se promedia ruido)
  # Coste por batch de 256 nodos semilla: 3.4K nodos con 1 capa, 12.3K con 2,
  # 23.7K con 3 — o sea que 1 capa entrena ~7x más barato.
  #
  # MÍNIMO DOS CAPAS. En el grafo bipartito, llegar de una transacción a otra
  # cuesta dos saltos: transacción -> entidad -> transacción. Con una sola capa
  # los nodos de entidad siguen siendo ceros cuando alcanzan a la transacción y
  # el vecindario NO influye — medido: diferencia con y sin aristas = 0.000000.
  # El modelo lanza un error si se pone menos de 2, para que no pase en silencio.
  #
  #   [64, 64]        2 saltos bipartitos = 1 salto entre transacciones
  #   [64, 64, 64]    3 capas; el tercero ya mezcla entidades distintas
  #
  # 64 y no 256: con embeddings densos no hace falta tanta anchura, y entrena
  # mucho más rápido. La salida hacia XGBoost la fija `mlp_head_dim`, no esto.
  hidden_dims: [64, 64]
  #
  # Las alternativas NO estrechan la salida a propósito: el embedding que
  # recibe la cabeza es `hidden_dims[-1]`, así que la pirámide clásica
  # [256,128,64] daría un vector de 64 — más estrecho que el de una sola capa.
  #
  mlp_head_dim: 32                 # cabeza clasificadora: última capa -> 32 -> 1
  dropout: 0.2
  fanouts: [15, 10, 5]             # vecinos por salto; se usan los primeros N
  # Lotes pequeños dan gradientes más ruidosos, que ayudan a escapar de
  # mínimos locales. Con balanceo de semillas, 256 son 128 fraudes + 128
  # normales por lote.
  # Lotes GRANDES a propósito. El cuello de botella NO es el cálculo sino el
  # número de transferencias worker -> proceso principal: cada lote de un grafo
  # heterogéneo son 30+ tensores (5 tipos de nodo, 10 de arista) que hay que
  # serializar. Medido con 256: 1.604 lotes por época, GPU al 5%, 3,7 min/época.
  # Con 1024 son 401 lotes — mismo trabajo, la cuarta parte de viajes.
  # VRAM: 250 MB con 256, ~1 GB con 1024, de 19.500 disponibles.
  # FÍJALO ANTES de la primera corrida: cambia la dinámica de entrenamiento y
  # las 6 semillas deben compartirlo.
  # MEDIDO en la corrida real (/proc, 20 muestras): el proceso principal estaba
  # en R (ejecutando) 14 de 20 veces y los 12 workers en S (durmiendo) 20 de 20,
  # con la GPU al 4%. O sea: el muestreo NO es el cuello y el cálculo tampoco.
  # El tiempo se va en ORQUESTAR: HeteroConv recorre los 10 tipos de arista en
  # un bucle de Python y lanza una convolución por cada uno.
  #     10 aristas x 2 capas x 1.604 lotes = 32.000 kernels diminutos por época
  # Cada kernel se despacha en microsegundos y la GPU espera al siguiente: el
  # coste está en el Python que los lanza, y ese coste es POR LOTE.
  # Con 2048 son 201 lotes/época en vez de 1.604: 8x menos orquestación.
  # VRAM: 250 MB con 256 -> ~1,5 GB con 2048, de 19.500 disponibles.
  # FÍJALO ANTES de la primera corrida: las 6 semillas deben compartirlo.
  batch_size: 2048
  lr: 0.001
  # Regularización L2: penaliza pesos grandes para que la red no memorice
  # los fraudes concretos del entrenamiento. No se estaba aplicando en el
  # bucle principal, solo dentro de la búsqueda de Optuna.
  weight_decay: 0.0005
  epochs: 50
  patience: 10             # early stopping sobre PR-AUC de validación                      # early stopping sobre AUC de validación
  # Épocas del paso `refit`. Vacío = usar el pico de la corrida ganadora, que
  # compare_gnns anota en selected_model.json. Poner un número aquí permite
  # relanzar SOLO el refit con otra cantidad, sin repetir las 6 corridas.
  refit_epochs:
  log_every: 0                     # 0 = solo una línea por época (recomendado). >0 = avance cada N batches
  # Muestreo en paralelo (solo aplica con el sampler nativo pyg-lib; el
  # fallback en numpy los ignora). num_workers > 0 samplea el batch siguiente
  # MIENTRAS la GPU calcula el actual, en vez de alternarse con ella.
  # Regla: deja 2-3 núcleos libres respecto a compute.n_jobs.
  # OJO: cambia el ORDEN de muestreo. Fíjalo antes de la primera corrida y no
  # lo toques durante las 6 seeds (el paso 5 exige igualdad de condiciones).
  # ABLACIÓN: true anula TODAS las aristas (cada nodo queda aislado y el modelo
  # se convierte en una MLP con la misma capacidad). Responde si el grafo aporta
  # algo: si el AUC no baja, la GNN nunca lo estaba usando. No modifica graph.pt.
  sin_aristas: false
  # 12 de los 16 vCPU muestreando; los 4 restantes, para el proceso
  # principal y la GPU. El muestreo de vecinos es el cuello de botella
  # de `gnn` y `oof` (las dos etapas caras), no las multiplicaciones.
  # 4 y no 12: medido con /proc, los 12 workers estaban DORMIDOS en las 20
  # muestras. Llenan su cola y esperan, porque el cuello está en el proceso
  # principal. Subirlos no aporta nada y cada uno copia el grafo.
  num_workers: 4                   # 0 = todo en el proceso principal
  prefetch_factor: 4               # lotes que cada worker deja listos
  pin_memory: true                 # copia CPU->GPU más rápida (cientos de MB/batch)
  seeds: [42, 123, 2026]           # 3 corridas por arquitectura
  gat_heads: 4
  # GATv2 en vez de GAT: la atención de GAT es estática (el ranking de vecinos
  # no depende del nodo que pregunta). GATv2 lo corrige y es estrictamente más
  # expresivo — Brody et al., ICLR 2022.
  arquitecturas: ["graphsage", "gatv2"]
  # AGREGACIÓN de vecinos. La media destruye la dispersión, y la dispersión es
  # lo ÚNICO que no está ya en las columnas del dataset: C1-C14 son conteos,
  # D1-D15 deltas temporales y V1-V339 agregados de historial — ninguna trae
  # varianza. Con ["mean","max","std"] la red recibe el centro, el extremo y la
  # irregularidad del vecindario.
  #   una tarjeta con 15 compras de 20€ y una de 800€
  #     mean -> 78€    (el pico desaparece)
  #     max  -> 800€   (el pico sobrevive)
  #     std  -> 195€   (y se ve que es irregular)
  #   sum: distingue "tengo pocos vecinos" de "tengo muchos". OJO: NO recupera
  #        el conteo real, porque el muestreo ya capó a `vecinos_por_entidad`
  #        (una entidad con 3 transacciones y otra con 300 traen 3 y 10). El
  #        conteo de verdad lo da la feature __grado_<entidad>, contada sobre el
  #        grafo completo. `sum` solo añade "cuántos de los 10 huecos se
  #        llenaron", que es información parcial pero gratis.
  aggr: ["mean", "max", "std", "sum"]
  # DESBALANCE por muestreo, no por pérdida: cada lote lleva 50% fraudes,
  # repitiendo fraudes REALES como semilla. No se inventa ningún nodo ni arista
  # (un nodo sintético no tendría vecinos), y cada repetición ve un vecindario
  # distinto, así que funciona como aumento de datos.
  # Arregla algo que pos_weight no toca: el BatchNorm calcula sus estadísticas
  # CON EL LOTE, y con 988 normales contra 36 fraudes esas estadísticas son las
  # de una compra normal.
  balanceo_semillas: true
  # OJO: con los lotes balanceados hay que BAJAR pos_weight o el desbalance se
  # corrige dos veces y la red sobrepredice fraude. 1.0 = sin corrección extra.
  pos_weight_con_balanceo: 1.0
  # Búsqueda de hiperparámetros para la GNN. Hasta ahora XGBoost recibía 30
  # trials y la GNN cero: la comparación no era justa en esfuerzo de ajuste.
  # No es paridad de cómputo (un trial de XGBoost cuesta 13 s y uno de GNN
  # ~5 min) pero sí de protocolo, que es lo que se defiende.
  # 12 y no 30: cada trial son epochs//4 = 12 épocas sobre 410.601 nodos.
  # A 30 trials x 2 arquitecturas la etapa `gnn` sola pasaba de 40 horas.
  # Sigue siendo búsqueda bayesiana con el mismo sampler; decláralo en la
  # memoria junto a los 30 trials que sí reciben las cabezas XGBoost.
  optuna_trials: 12
  threshold: 0.5                   # umbral de alerta P(fraude) >= 0.5
  kpi_auc: 0.93                    # KPI OE2: AUC-ROC > 0.93

xgboost:
  # Baseline CONGELADO: entrenado solo meses 1-4, nunca se reentrena
  smote:
    sampling_strategy: 0.5         # fraudes sintéticos hasta ratio 1:2 (solo en TRAIN)
    k_neighbors: 5
    # Se midió contra scale_pos_weight con los mismos hiperparámetros:
    #   SMOTE            PR-AUC 0.5866   594,273 filas
    #   scale_pos_weight PR-AUC 0.5627   410,601 filas
    # SMOTE gana 0.024, así que se mantiene. Coste asumido: al aplicarlo a las
    # columnas del grafo interpola valores sin vecindario real detrás. Ambos
    # modelos comparados reciben idéntico tratamiento, así que la comparación
    # no se ve afectada. La GNN no puede usarlo (un nodo sintético no tiene
    # aristas) y sigue con pos_weight en la loss.
  optuna_trials: 30                # búsqueda bayesiana de hiperparámetros

  # ── ABLACIONES SOBRE LAS COLUMNAS Y LA CAPACIDAD ───────────────────────────
  # Se aplican a TODAS las cabezas por igual. Esa es la condición para que la
  # comparación siga midiendo lo que dice medir: si `control` corre con menos
  # columnas o menos capacidad que `gnn_mas_tabular`, la diferencia entre ellas
  # deja de ser "el aporte del grafo" y pasa a ser "quién recibió mejor trato".
  #
  # excluir_prefijos: quita familias enteras de columnas. La interesante es
  #   ["V", "C", "D"]: son los agregados relacionales que Vesta precalculó
  #   (conteos por entidad, deltas temporales, rankings sobre historiales), y
  #   son la explicación de por qué el grafo no aportaba nada. Quitarlas prueba
  #   esa hipótesis DIRECTAMENTE: si el grafo empieza a aportar sin ellas, la
  #   redundancia queda demostrada y es un resultado positivo.
  #   431 columnas -> ~92 al excluir V, C y D.
  excluir_prefijos: ["V", "C", "D"]

  # capacidad_limitada: fuerza un modelo pequeño y salta Optuna. Responde
  #   "¿aporta más el grafo cuando el tabular no puede exprimir 431 columnas?".
  capacidad_limitada:
    activo: false
    max_depth: 3
    n_estimators: 100
    colsample_bytree: 1.0

  # ── CÓMO SE AJUSTA CADA CABEZA ─────────────────────────────────────────────
  # Las tres cabezas reciben entradas MUY distintas:
  #     control          431 columnas, mayormente categóricas y dispersas
  #     solo_gnn          32 columnas, densas y continuas
  #     gnn_mas_tabular  463 columnas, mezcla de las dos cosas
  # Un colsample o una profundidad que le va bien a 431 columnas dispersas
  # puede estar penalizando a 32 densas. Hay dos protocolos válidos:
  #
  #   "compartido"   Optuna corre UNA vez sobre la variante más pequeña y las
  #                  tres heredan. La diferencia entre cabezas es atribuible
  #                  SOLO a las columnas, y cualquier ventaja de las grandes es
  #                  una cota inferior conservadora. Es el más estricto.
  #
  #   "por_cabeza"   Optuna corre para CADA cabeza con el MISMO número de
  #                  trials y el mismo sampler. Cada una rinde a su máximo, que
  #                  es más justo cuando las entradas son tan distintas. A
  #                  cambio, la diferencia entre cabezas incluye algo de suerte
  #                  en la búsqueda: hay que declararlo en la memoria.
  #                  Es el protocolo habitual en la literatura.
  #
  # Lo que NO vale es fijar a mano hiperparámetros peores para una cabeza que
  # para otra: eso no mide las columnas, mide quién recibió mejor trato.
  optuna_modo: "por_cabeza"

  # Ajustes finos POR CABEZA, encima de lo que salga de Optuna. Vacíos por
  # defecto. Si pones algo aquí, el log te avisa: es un valor elegido a mano y
  # necesita justificación en la memoria.
  # Estos valores SIEMBRAN la búsqueda de Optuna de esa cabeza: se evalúan como
  # primer trial, así que la búsqueda parte de una configuración conocida y solo
  # puede mejorarla. No la sustituyen — fijar hiperparámetros a mano cuando la
  # otra cabeza recibe 30 trials sería PERJUDICAR a esta, porque una búsqueda
  # bayesiana casi siempre gana a una elección manual.
  #
  # Los de abajo están pensados para entradas con embeddings densos: árboles
  # menos profundos, aprendizaje lento y más árboles, que es lo que suele ir
  # mejor con features continuas que con 431 columnas categóricas dispersas.
  por_cabeza:
    control: {}
    solo_gnn:
      max_depth: 6
      n_estimators: 500
      learning_rate: 0.03
      colsample_bytree: 0.8
      subsample: 0.8
    gnn_mas_tabular:
      max_depth: 6
      n_estimators: 500
      learning_rate: 0.03
      colsample_bytree: 0.8
      subsample: 0.8
  # Dónde entrena XGBoost: "auto" usa la GPU si hay CUDA, si no CPU.
  # En una VM con GPU esto baja la búsqueda de 30 trials de ~35 min a minutos.
  # Fuerza "cpu" si quieres el baseline reproducible en cualquier máquina.
  device: "auto"                   # auto | cuda | cpu
  early_stopping_rounds: 50

hybrid:
  # Sistema híbrido: GNN + columnas del grafo + cabeza XGBoost.
  # La cabeza recibe 431 features originales + 8 estructurales + gnn_score.
  oof_folds: 4                     # trozos para el gnn_score honesto
  # TRES CABEZAS, con nombre en vez de número: el número dependía de `in_dim`
  # y cambiaba solo al tocar el dataset.
  #   control          las N features tabulares         ¿cuánto vale lo tabular solo?
  #   solo_gnn         SOLO la salida de la GNN         ¿basta el grafo por sí mismo?
  #   gnn_mas_tabular  tabular + salida de la GNN       ¿APORTA el grafo sobre lo tabular?
  # La pregunta del capstone la responde `control` vs `gnn_mas_tabular`, con
  # idéntica ventana de entrenamiento. `solo_gnn` acota el techo del grafo aislado.
  variantes: ["control", "solo_gnn", "gnn_mas_tabular"]
  optuna_on_variant: "control"     # se afina sobre la MÁS PEQUEÑA a propósito:
                                   # así la ventaja de las otras es una cota
                                   # inferior conservadora, no atacable por
                                   # hiperparámetros
  # Umbral por VOLUMEN de alertas, no fijo. La GNN entrena con pos_weight ~27
  # (scores inflados) y la cabeza devuelve probabilidades calibradas ~3%: con
  # 0.5 el híbrido no alertaría casi nada y ningún ciclo de CL desplegaría.
  # La GNN entrega hoy UN escalar (gnn_score) contra 431 columnas tabulares.
  # Con esto se entrena además una variante que recibe el EMBEDDING entero: el
  # vector de la última capa (431+8+dim columnas; con hidden_dims [256] son
  # 695). El número de variante se calcula solo a partir de hidden_dims.
  # Coste: el parquet del OOF pasa de ~4 MB a ~500 MB y XGBoost entrena sobre
  # 695 columnas. Ponlo en false para volver al comportamiento anterior.
  usar_embedding: true
  # OBSOLETO desde que cada variante elige su embedding:
  #   solo_gnn         usa emb_*   (completo: es lo único que recibe)
  #   gnn_mas_tabular  usa embv_*  (vecinos: las propias ya van en el tabular)
  # Ya no hay un modo global que pueda quedarse mal puesto. Se conserva la clave
  # porque el continual learning la leerá cuando se reactive.
  embedding_modo: "vecinos"
  alert_budget_pct: 2.0            # % del mes que se marca para revisión
  cl_head:
    # Warm start de la cabeza en cada ciclo: la mezcla 40/60 son ~20 filas, así
    # que reentrenar desde cero daría ruido. Árboles poco profundos para que
    # solo puedan hacer correcciones groseras con tan pocos puntos.
    rounds: 30
    lr_scale: 0.1
    max_depth: 3
    min_child_weight: 5

continual_learning:
  trigger:
    score_threshold: 0.5           # fraude confirmado con score < 0.5 = patrón nuevo
    min_cases: 50                  # disparo por conteo
    miss_rate: 0.30                # o disparo por tasa (>30% de fraudes no detectados)
  split:
    adaptation: 0.70               # entrena (luego va al buffer)
    verification: 0.30             # NUNCA entrena (luego va al control)
  replay_buffer:
    size: 10000
    class_balance: 0.5             # 50/50 fraude-legítima por selección real (sin SMOTE)
    frontier_range: [0.4, 0.7]     # casos frontera: los más fáciles de olvidar
    historical_floor: 0.60         # piso de base histórica al actualizar
    max_intake_per_pattern: 800    # patrones grandes se samplean
  control_set:
    size: 5000
    max_intake_per_pattern: 200
  finetune:
    mix_new: 0.40                  # 40% casos nuevos por batch
    mix_buffer: 0.60               # 60% replay buffer
    batch_size: 64
    epochs: 8                      # 5-10 épocas -> minutos, no horas
    # LR diferenciado: el drift mueve la FRONTERA, no la estructura
    lr_layer1: 0.0                 # congelada (representaciones estructurales)
    lr_layer2: 0.00001             # 1e-5
    lr_layer3: 0.0001              # 1e-4
    lr_classifier: 0.001           # 1e-3
  validation:
    recall_verification_min: 0.70  # ¿aprendió? KPI >= 70%
    control_max_drop: 0.02         # ¿olvidó? caída máxima tolerada en control
    max_hours: 48                  # KPI ciclo completo < 48h
    max_retries: 3                 # reintentos con el dial estabilidad-plasticidad
  # Dial estabilidad-plasticidad (ajustes por reintento)
  dial:
    stability:                     # falló recall histórico (olvidó)
      mix_new: 0.30
      lr_scale: 0.5
      freeze_layer3: true
      epochs: 5
    plasticity:                    # falló recall nuevo (no aprendió)
      mix_new: 0.50
      lr_scale: 2.0
      unfreeze_layer2: true
      epochs: 12

comparison:
  # El desglose de métricas (por mes, mes 5, mes 6) no necesita configuración:
  # los presupuestos y precisiones objetivo están en final_comparison.py.

